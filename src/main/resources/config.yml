# SHJumpPads - plaques de saut
#
# Les plaques sont stockées dans jumppads.yml (même format que l'ancien plugin JumpPads, qui est importé
# automatiquement au premier démarrage s'il est présent). Les textes sont dans messages.yml.
# Une plaque se pose sur une plaque de pression ou un bloc de slime ; le joueur qui marche dessus est lancé.
# Chaque plaque peut exiger une permission (champ permission de jumppads.yml, réglé par /shjumppads set permission),
# par exemple shjumppads.pad.vip : le nom est libre et la permission est vérifiée en plus de shjumppads.use.
#
# Commandes (alias : /shjp) :
#   /shjumppads create [puissance] [angle] [direction|auto|here]   Crée une plaque sur le bloc visé ou sous vos pieds.
#   /shjumppads delete                                             Supprime la plaque visée.
#   /shjumppads set <power|angle|direction|particle|permission> <valeur|none>   Modifie la plaque visée.
#   /shjumppads info                                               Affiche les réglages de la plaque visée.
#   /shjumppads list                                               Liste les plaques (50 au maximum).
#   /shjumppads reload                                             Recharge config.yml et messages.yml.
#                                                                  jumppads.yml n'est pas relu : les plaques en mémoire
#                                                                  font foi (il l'est seulement s'il était illisible au
#                                                                  démarrage). Une erreur de syntaxe annule le rechargement.
#   create, delete, set et info demandent un joueur ; list et reload marchent aussi en console.
#
# Permissions :
#   shjumppads.use              Être lancé par une plaque (tout le monde par défaut).
#   shjumppads.bypass.maxpower  Dépasser max-power à la création et à la modification (op par défaut).
#   shjumppads.admin            Toute l'administration (op par défaut).
#   shjumppads.admin.create     create.
#   shjumppads.admin.delete     delete.
#   shjumppads.admin.set        set.
#   shjumppads.admin.info       info.
#   shjumppads.admin.list       list.
#   shjumppads.admin.reload     reload.

# Puissance maximale autorisée à la création (sauf permission shjumppads.bypass.maxpower)
max-power: 50
# Sans direction fixée sur la plaque, le joueur part dans le sens où il marche
launch-in-walking-direction: true
# Bloque les téléportations (ender pearl, chorus) pendant le vol
block-teleporting: true

trail:
  enabled: true
  # Couleur de la particule DUST (nom de couleur ou hex #RRGGBB)
  color: 'red'
  density: 1

sound:
  enabled: true
  # true : tout le monde entend le son, false : seulement le joueur lancé
  world: true
  # Clé de son Minecraft (ex : entity.wither.shoot)
  name: 'entity.wither.shoot'
  volume: 1.0
  pitch: 1.0

# Cercle de particules qui tourne au-dessus de chaque plaque
visualizer:
  enabled: true
  particle: DUST
  color: 'red'
  radius: 0.5
  rotation-speed: 2

launch-effect:
  enabled: true
  # Valeur de org.bukkit.Effect (EXPLOSION_LARGE n'existe plus depuis la 1.20.5)
  effect: END_GATEWAY_SPAWN

# Supprime la plaque quand son bloc est cassé
clean-up: true
